name: Release rule pack

# Triggered by tags shaped like rules-v1.2.3.
# Signs RulePacks/<tag>.json with the private key from secrets and uploads
# the JSON + signature to a GitHub Release.
#
# IMPORTANT: this workflow lives in the public mac-cleaner-pro-rules repo.
# The RULEPACK_PRIVATE_KEY secret must only be set there — never in the app repo.

on:
  push:
    tags:
      - 'rules-v*'

permissions:
  contents: write   # needed to create the release

jobs:
  sign-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve pack file from tag
        id: pack
        run: |
          # Tag rules-v1.2.3 → file RulePacks/v1.json (major version only).
          TAG="${GITHUB_REF_NAME#rules-v}"
          MAJOR="${TAG%%.*}"
          FILE="RulePacks/v${MAJOR}.json"
          if [[ ! -f "$FILE" ]]; then
            echo "ERROR: $FILE does not exist for tag $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Sign rule pack
        env:
          RULEPACK_PRIVATE_KEY: ${{ secrets.RULEPACK_PRIVATE_KEY }}
        run: |
          if [[ -z "$RULEPACK_PRIVATE_KEY" ]]; then
            echo "ERROR: RULEPACK_PRIVATE_KEY secret is not set." >&2
            exit 1
          fi
          ./tools/sign-rules.sh "${{ steps.pack.outputs.file }}"

      - name: Verify signature (sanity)
        run: ./tools/verify-rules.sh "${{ steps.pack.outputs.file }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.file }}
            ${{ steps.pack.outputs.file }}.sig
          generate_release_notes: true
          fail_on_unmatched_files: true
